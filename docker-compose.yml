services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bu_site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bu_site
    # Reachable only from this machine. Remove the mapping if nothing outside Compose needs the database.
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - bu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bu_site -d bu_site"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    # Bound to this machine. Put a TLS reverse proxy in front for public traffic;
    # the rate limits rely on the X-Forwarded-For entry that proxy appends.
    ports:
      - "127.0.0.1:3847:3847"
    environment:
      DATABASE_URL: postgresql://bu_site:${POSTGRES_PASSWORD}@db:5432/bu_site
      SESSION_SECRET: ${SESSION_SECRET}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:3847}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  bu_pg:
